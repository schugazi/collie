<!doctype html>
<!-- No theme class here: `color-scheme: light dark` in index.css follows the OS, and
     public/theme-init.js stamps `light`/`dark` before first paint only when the user has pinned
     one. The cascade decides, not the markup. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Blocking, and first: the pin class must be on <html> before anything paints. Same-origin,
         so `script-src 'self'` already allows it. -->
    <script src="/theme-init.js"></script>
    <!-- Browser chrome follows the OS for System users. useTheme rewrites these at runtime for
         someone who has pinned the opposite of their OS. -->
    <meta
      name="theme-color"
      content="#f5f5f5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Not `black-translucent`: iOS 27 blurs the top edge of a translucent one, into the header.
         iOS reads this once, at Add to Home Screen, so a change needs a re-add to show. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta name="apple-mobile-web-app-title" content="mycroftxxx" />
    <!-- Where this document is mounted (ADR 0052). `/` as built; the bridge rewrites it, and every
         root-absolute reference in this file, to the path a proxy gave mycroftxxx remote when it serves the
         file. One build serves any mount, so the value is not known here. lib/base-path.ts reads it. -->
    <meta name="collie-base" content="/" />
    <title>mycroftxxx remote</title>
    <!-- The UI typeface, fetched in parallel with the CSS that asks for it rather than after it.
         index.css already guarantees no layout shift with a metric-matched fallback, so this is not
         load-bearing — it just means the swap usually never happens at all. `crossorigin` is
         MANDATORY on a font preload even same-origin (fonts are fetched in CORS mode); without it
         the browser fetches the file twice. ONLY THE DEFAULT FACE is preloaded — the other shipped
         face is a deliberate choice a reader made, and preloading a file most devices never render
         would spend everyone's first paint on a minority. Keep the URL in step with
         DEFAULT_UI_FONT_URL in src/lib/sw-routes.ts and the @font-face in src/index.css —
         fonts.test.ts pins all three. -->
    <link
      rel="preload"
      href="/fonts/ui-aldrich-1.002-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The web manifest <link> is injected by vite-plugin-pwa at build time. -->
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Dashboard artwork is also the first-paint splash. -->
    <style>
      /* The document is an app shell; routes, terminal output and sheets own scrolling.
         pan-x pan-y permits those scrollers without pinch or double-tap page zoom.
         Horizontal browser history swipes remain available.
         Keep this here so it also covers the first-paint splash, before the bundle loads. */
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: auto none;
        touch-action: pan-x pan-y;
      }
      body { position: fixed; inset: 0; margin: 0; }
      /* index.css has not loaded at this point, so the splash declares `color-scheme` itself —
         otherwise light-dark() below has nothing to resolve against and every value falls to its
         light branch. These three rules mirror index.css exactly; keep them in step. */
      :root {
        color-scheme: light dark;
      }
      :root.light {
        color-scheme: light;
      }
      :root.dark {
        color-scheme: dark;
      }
      /* The UI typefaces, declared a second time. index.css has not loaded here either, and the
         splash's caption is the same string at the same size as routes/root.tsx's BootSplash — so
         if the splash painted in the system face and React's copy painted in the chosen one, the
         hand-off would change the family and the line under the operator's eyes. Same faces, same
         stand-ins, same overrides; keep them in step with index.css. The default file is preloaded
         above, so for most devices this costs no extra request. */
      @font-face {
        font-family: "Space Grotesk";
        src: url("/fonts/ui-space-grotesk-2.000-latin.woff2") format("woff2");
        font-weight: 400 700;
        font-display: swap;
      }
      @font-face {
        font-family: "Space Grotesk Fallback";
        src:
          local("Arial"), local("Helvetica Neue"), local("Helvetica"),
          local("Liberation Sans"), local("Arimo"), local("Roboto");
        size-adjust: 107.53%;
        ascent-override: 91.51%;
        descent-override: 27.16%;
        line-gap-override: 0%;
      }
      /* Aldrich is the DEFAULT face now, so this is the block the preload above warms — the
         splash and React's first paint resolve to it on any device that never opened the setting.
         One weight; the synthesized bold is index.css's note. Space Grotesk above it stays on the
         same terms it always had, but the roles flipped: theme-init.js has already put
         `font-grotesk` on <html> for a reader who chose it, and that face now costs its own fetch
         while Aldrich rides the preload. Keep in step with index.css. */
      @font-face {
        font-family: "Aldrich";
        src: url("/fonts/ui-aldrich-1.002-latin.woff2") format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Aldrich Fallback";
        src:
          local("Arial"), local("Helvetica Neue"), local("Helvetica"),
          local("Liberation Sans"), local("Arimo"), local("Roboto");
        size-adjust: 113.37%;
        ascent-override: 63.53%;
        descent-override: 18.52%;
        line-gap-override: 4.22%;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        /* --background / --muted-foreground rasterized, because index.css has not loaded yet:
           oklch(0.97)/oklch(0.48) light, oklch(0.145)/oklch(0.708) dark. The light pair used to be
           #ffffff/#8a8a8a, which is neither token — the page stepped from white to rgb(245) on
           hand-off to React, and the caption sat at 3.45:1. Keep in step with index.css. */
        background: light-dark(#f5f5f5, #0a0a0a);
        color: light-dark(#5d5d5d, #a1a1a1);
        font:
          500 0.875rem/1.4 var(--font-sans);
      }
      /* The typeface setting, mirrored from index.css (ADR 0033). The splash resolves --font-sans
         like everything else does, so the same three blocks decide the same thing here — otherwise
         a reader on Aldrich would get a Space Grotesk splash and a change of voice on hand-off,
         which is the exact failure the block above this one exists to prevent. `font-operator` is
         NOT mirrored: an operator face has no pre-paint path (theme-init.js says why), so it
         resolves through the default below, which is what it should do. Keep in step with
         index.css. */
      :root {
        --font-sans:
          "Aldrich", "Aldrich Fallback", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      :root.font-system {
        --font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }
      :root.font-grotesk {
        --font-sans:
          "Space Grotesk", "Space Grotesk Fallback", ui-sans-serif, system-ui,
          -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      .boot-splash__logo { width: 4rem; height: 4rem; }
      /* Revealed late: a boot quicker than the delay goes straight from the plain background to
         the app and never flashes "Connecting…". routes/root.tsx's BootSplash takes this same
         timeline over at hand-off, so the fade never restarts. Keep the delay in step with
         SPLASH_REVEAL_MS there, and the keyframes with index.css. */
      .boot-splash > * { animation: boot-splash-in 200ms ease-out 1s both; }
      @keyframes boot-splash-in { from { opacity: 0; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="Loading mycroftxxx remote">
        <!-- The same file CollieMark draws, so the hand-off to React finds it already decoded. -->
        <img class="boot-splash__logo" src="/src/assets/remote-logo.png" alt="" />
        <span>Connecting to mycroftxxx remote…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
